name: MCX Monitor Bridge

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan 3GPP archive and latest-drafts
        shell: bash
        run: |
          set -u
          mkdir -p out work
          : > out/archive.tsv
          : > out/latest-drafts.tsv
          : > out/failures.tsv
          ua='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0 Safari/537.36'
          while IFS=$'\t' read -r spec archive; do
            [ -z "${spec:-}" ] && continue
            rm -rf work/*
            mkdir -p work
            curl -fsSL -A "$ua" -c work/cookies.txt "$archive" -o /dev/null || true
            if curl -fsSL -A "$ua" -e "$archive" -b work/cookies.txt "$archive" -o work/page.html; then
              grep -Eoi 'href=["'"'"'][^"'"'"']+\.zip([^"'"'"']*)?["'"'"']' work/page.html | sed -E 's/^href=["'"'"']//I; s/["'"'"']$//' | sort -u | while read -r href; do
                name="${href%%\?*}"; name="${name##*/}"
                printf '%s\t%s\t%s\t%s\n' "$spec" "$name" "$href" "$archive" >> out/archive.tsv
              done
            else
              printf '%s\t%s\tarchive_list_failed\n' "$spec" "$archive" >> out/failures.tsv
            fi
          done < mcx-monitor/specs.tsv
          latest='https://www.3gpp.org/ftp/Specs/latest-drafts/'
          rm -rf work/*
          mkdir -p work
          curl -fsSL -A "$ua" -c work/cookies.txt "$latest" -o /dev/null || true
          if curl -fsSL -A "$ua" -e "$latest" -b work/cookies.txt "$latest" -o work/latest.html; then
            grep -Eoi 'href=["'"'"'][^"'"'"']+\.zip([^"'"'"']*)?["'"'"']' work/latest.html | sed -E 's/^href=["'"'"']//I; s/["'"'"']$//' | sort -u > work/latest-links.txt || true
            while IFS=$'\t' read -r spec archive; do
              [ -z "${spec:-}" ] && continue
              prefix="${spec/./}"
              while read -r href; do
                name="${href%%\?*}"; name="${name##*/}"
                case "${name,,}" in
                  "${prefix,,}"*) printf '%s\t%s\t%s\n' "$spec" "$name" "$href" >> out/latest-drafts.tsv ;;
                esac
              done < work/latest-links.txt
            done < mcx-monitor/specs.tsv
          else
            printf '%s\t%s\tlatest_drafts_list_failed\n' '-' "$latest" >> out/failures.tsv
          fi
          echo "archive_rows=$(wc -l < out/archive.tsv)"
          echo "latest_rows=$(wc -l < out/latest-drafts.tsv)"
          echo "failure_rows=$(wc -l < out/failures.tsv)"
          cat out/failures.tsv || true
      - name: Upload monitor report
        uses: actions/upload-artifact@v4
        with:
          name: mcx-monitor
          path: out/*
          if-no-files-found: error
          retention-days: 1
