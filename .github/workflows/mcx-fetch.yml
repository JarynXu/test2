name: MCX Fetch Bridge

on:
  pull_request:
    branches: [main]
    paths:
      - 'mcx-fetch/manifest.tsv'

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and unpack 3GPP specifications
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out work
          while IFS=$'\t' read -r url output; do
            [ -z "${url:-}" ] && continue
            echo "Fetching $url -> $output"
            rm -rf work/*
            curl -fL --retry 5 --retry-delay 2 "$url" -o work/spec.zip
            unzip -q work/spec.zip -d work/unpack
            src="$(find work/unpack -type f \( -iname '*.docx' -o -iname '*.doc' \) | head -n 1)"
            test -n "$src"
            ext="${src##*.}"
            cp "$src" "out/${output}.${ext}"
          done < mcx-fetch/manifest.tsv
          ls -lh out
      - name: Upload fetched specifications
        uses: actions/upload-artifact@v4
        with:
          name: mcx-specs
          path: out/*
          if-no-files-found: error
          retention-days: 1
